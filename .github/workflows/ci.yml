name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Blocking: a broken production build fails the check.
      # No secrets needed: Vite inlines VITE_SUPABASE_* at build time, but a
      # missing value does not fail the build (src/lib/supabase.ts throws at
      # app startup instead), so CI only checks that the bundle compiles.
      - name: Build
        run: npm run build

      # Blocking: unit tests for src/lib (screening score, dates, export
      # escaping, validation). Supabase is mocked, so no secrets are needed.
      - name: Test
        run: npm test

      # Blocking: types come from src/types/supabase.ts (generated from
      # supabase/migrations). Lint warnings don't fail the check; errors do.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Deploys are handled by the Vercel Git integration, not by this workflow.
